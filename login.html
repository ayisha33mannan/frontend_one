<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLIYO - Real Estate</title>
    <!-- stylesheet -->
    <link rel="stylesheet" href="login.css">
    <!--google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <!-- icon link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
</head>
<body>
    <!-- Preloader -->
    <div id="preloader"></div>

    <!-- nav bar start -->
    <nav>
        <!-- logo nav -->
        <a href="index.html" class="nav-logo">OLIYO</a>

        <!-- hamburger -->
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <!-- nav links -->
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#gallery">Properties</a></li>
            <li><a href="login.html" class="active">Login</a></li>
        </ul>
    </nav>

    <!--card container-->
    <div class="flip-container">
        <div class="flip-card" id="flipCard">

            <!--front -->
            <div class="flip-front">
                <h2 class="form-heading">LOG <span>IN</span></h2>

                <form onsubmit="event.preventDefault();">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-envelope"></i></span>
                            <input type="email" placeholder="Email" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-lock"></i></span>
                            <input type="password" placeholder="Password" required>
                        </div>
                    </div>

                    <div class="form-options">
                        <label>
                            <input type="checkbox" checked> Remember me
                        </label>
                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit" class="auth-submit">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>

                <div class="auth-divider">
                    <span>Or</span>
                </div>

                <div class="social-buttons">
                    <button class="social-btn google"><i class="fab fa-google"></i></button>
                    <button class="social-btn github"><i class="fab fa-github"></i></button>
                    <button class="social-btn twitter"><i class="fab fa-twitter"></i></button>
                </div>

                <div class="flip-trigger">
                    Don't have an account? <a onclick="flipCard()">Sign Up</a>
                </div>
            </div>

            <!--back-->
            <div class="flip-back">
                <h2 class="form-heading">SIGN <span>UP</span></h2>

                <form onsubmit="event.preventDefault();">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-user"></i></span>
                            <input type="text" placeholder="Full Name" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-envelope"></i></span>
                            <input type="email" placeholder="Email" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-lock"></i></span>
                            <input type="password" placeholder="Password" required>
                        </div>
                    </div>

                    <div class="form-options">
                        <label>
                            <input type="checkbox" id="termsCheck"> I agree to Terms
                        </label>
                    </div>

                    <button type="submit" class="auth-submit" id="signupBtn" disabled>
                        <i class="fas fa-user-plus"></i> Sign Up
                    </button>
                </form>

                <div class="auth-divider">
                    <span>Or</span>
                </div>

                <div class="social-buttons">
                    <button class="social-btn google"><i class="fab fa-google"></i></button>
                    <button class="social-btn github"><i class="fab fa-github"></i></button>
                    <button class="social-btn twitter"><i class="fab fa-twitter"></i></button>
                </div>

                <div class="flip-trigger">
                    Already have an account? <a onclick="flipCard()">Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- script file -->
    <script src="login.js"></script>
</body>
</html>
